<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        tgbg: 'var(--tg-theme-bg-color)',
                        tgtext: 'var(--tg-theme-text-color)',
                        tghint: 'var(--tg-theme-hint-color)',
                        tglink: 'var(--tg-theme-link-color)',
                        tgbutton: 'var(--tg-theme-button-color)',
                        tgbuttontext: 'var(--tg-theme-button-text-color)',
                        tgsecondarybg: 'var(--tg-theme-secondary-bg-color)'
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #222222;
            --tg-theme-hint-color: #999999;
            --tg-theme-link-color: #2678b6;
            --tg-theme-button-color: #5288c1;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-secondary-bg-color: #f5f5f5;
        }
        
        @keyframes spinner {
            to {transform: rotate(360deg);}
        }
        
        .loader {
            animation: spinner 1s linear infinite;
        }
    </style>
</head>
<body class="bg-tgbg text-tgtext dark:bg-gray-900 dark:text-white">
    <div class="px-4 py-4 pb-20">
        <h1 class="text-2xl font-bold text-center mb-4">Админ-панель</h1>
        
        <!-- Tab Content -->
        <div class="tab-content">
            <!-- Dashboard/Statistics Tab -->
            <div id="dashboard" class="tab-pane active">
                <div id="statsLoader" class="hidden w-12 h-12 loader border-4 border-tgbutton border-t-tgbuttontext rounded-full mx-auto my-5"></div>
                <div id="statsError" class="hidden bg-red-100 border border-red-400 text-red-700 dark:bg-red-900/30 dark:border-red-700 dark:text-red-400 px-4 py-3 rounded"></div>
                
                <div id="statsContent" class="hidden">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div class="bg-blue-50 dark:bg-blue-900/20 border-l-4 border-tgbutton rounded-lg p-4 shadow">
                            <h5 class="font-medium">Пользователи</h5>
                            <h2 id="countUsers" class="text-2xl font-bold">-</h2>
                        </div>
                        <div class="bg-blue-50 dark:bg-blue-900/20 border-l-4 border-tgbutton rounded-lg p-4 shadow">
                            <h5 class="font-medium">Общий баланс</h5>
                            <h2 class="text-2xl font-bold"><span id="totalBalance">-</span> TON</h2>
                        </div>
                    </div>
                    
                    <div class="bg-white dark:bg-gray-800 rounded-lg shadow mb-6">
                        <div class="bg-gradient-to-r from-tgbutton to-blue-700 text-white p-3 rounded-t-lg">
                            <h5 class="font-medium">Подарки</h5>
                        </div>
                        <div class="p-4">
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-4 border dark:border-gray-700">
                                    <h6 class="text-gray-500 dark:text-gray-400 text-center">Всего создано</h6>
                                    <h3 id="countAllGifts" class="text-xl font-bold text-center mt-2">-</h3>
                                </div>
                                <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-4 border dark:border-gray-700">
                                    <h6 class="text-gray-500 dark:text-gray-400 text-center">Активных</h6>
                                    <h3 id="countActiveGifts" class="text-xl font-bold text-center mt-2">-</h3>
                                </div>
                                <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-4 border dark:border-gray-700">
                                    <h6 class="text-gray-500 dark:text-gray-400 text-center">Завершенных</h6>
                                    <h3 id="countCompletedGifts" class="text-xl font-bold text-center mt-2">-</h3>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="bg-blue-50 dark:bg-blue-900/20 border-l-4 border-tgbutton rounded-lg p-4 shadow">
                            <h5 class="font-medium">Объем торгов</h5>
                            <h2 class="text-2xl font-bold"><span id="tradingVolume">-</span> TON</h2>
                        </div>
                        <div class="bg-blue-50 dark:bg-blue-900/20 border-l-4 border-tgbutton rounded-lg p-4 shadow">
                            <h5 class="font-medium">Баланс гифтера</h5>
                            <h2 class="text-2xl font-bold"><span id="nestGifterBalance">-</span> TON</h2>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Users Tab -->
            <div id="users" class="tab-pane hidden">
                <div id="usersLoader" class="hidden w-12 h-12 loader border-4 border-tgbutton border-t-tgbuttontext rounded-full mx-auto my-5"></div>
                <div id="usersError" class="hidden bg-red-100 border border-red-400 text-red-700 dark:bg-red-900/30 dark:border-red-700 dark:text-red-400 px-4 py-3 rounded"></div>
                
                <div id="usersContent" class="hidden">
                    <div class="bg-white dark:bg-gray-800 rounded-lg shadow mb-4">
                        <div class="bg-gradient-to-r from-tgbutton to-blue-700 text-white p-3 rounded-t-lg flex justify-between items-center">
                            <h5 class="font-medium">Список пользователей</h5>
                            <span id="totalUsers" class="bg-white/20 text-white px-2 py-1 rounded text-sm">Всего: 0</span>
                        </div>
                        <div class="p-4 overflow-x-auto">
                            <table class="min-w-full">
                                <thead class="border-b dark:border-gray-700">
                                    <tr>
                                        <th class="py-2 px-3 text-left">ID</th>
                                        <th class="py-2 px-3 text-left">Имя</th>
                                        <th class="py-2 px-3 text-left">Баланс (TON)</th>
                                        <th class="py-2 px-3 text-left">Рефералы</th>
                                        <th class="py-2 px-3 text-left">Дата регистрации</th>
                                        <th class="py-2 px-3 text-left">Статус</th>
                                    </tr>
                                </thead>
                                <tbody id="usersTableBody" class="divide-y dark:divide-gray-700">
                                    <!-- Data will be populated with JavaScript -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <div class="flex justify-center mt-4 mb-16">
                        <nav class="flex" aria-label="Pagination">
                            <ul id="usersPagination" class="inline-flex items-center -space-x-px">
                                <!-- Pagination will be populated with JavaScript -->
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Fixed Bottom Navigation Tabs -->
        <div class="fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-800 border-t dark:border-gray-700 shadow-lg z-10">
            <div class="flex justify-around">
                <button id="dashboardTab" class="active-tab flex-1 py-4 text-tgbutton dark:text-tgbuttontext font-medium border-t-2 border-tgbutton">
                    <div class="flex flex-col items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                        </svg>
                        <span>Статистика</span>
                    </div>
                </button>
                <button id="usersTab" class="flex-1 py-4 text-gray-500 dark:text-gray-400 font-medium">
                    <div class="flex flex-col items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                        </svg>
                        <span>Пользователи</span>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <script>
        // Initialize Telegram WebApp
        const webapp = window.Telegram.WebApp;
        webapp.expand();
        
        // Apply color scheme
        document.documentElement.style.setProperty('--tg-theme-bg-color', webapp.themeParams.bg_color);
        document.documentElement.style.setProperty('--tg-theme-text-color', webapp.themeParams.text_color);
        document.documentElement.style.setProperty('--tg-theme-hint-color', webapp.themeParams.hint_color);
        document.documentElement.style.setProperty('--tg-theme-link-color', webapp.themeParams.link_color);
        document.documentElement.style.setProperty('--tg-theme-button-color', webapp.themeParams.button_color);
        document.documentElement.style.setProperty('--tg-theme-button-text-color', webapp.themeParams.button_text_color);
        document.documentElement.style.setProperty('--tg-theme-secondary-bg-color', webapp.themeParams.secondary_bg_color || '#f5f5f5');
        
        // Force dark theme as requested
        document.documentElement.classList.add('dark');

        // Constants
        const API_BASE_URL = '/admin'; // This should match your API endpoint
        const ITEMS_PER_PAGE = 25;
        
        // DOM elements
        const statsLoader = document.getElementById('statsLoader');
        const statsError = document.getElementById('statsError');
        const statsContent = document.getElementById('statsContent');
        const usersLoader = document.getElementById('usersLoader');
        const usersError = document.getElementById('usersError');
        const usersContent = document.getElementById('usersContent');
        const dashboardTab = document.getElementById('dashboardTab');
        const usersTab = document.getElementById('usersTab');
        const dashboardPane = document.getElementById('dashboard');
        const usersPane = document.getElementById('users');
        
        // Current page for users pagination
        let currentUsersPage = 1;
        
        // Function to fetch data from API with initData header
        async function fetchWithAuth(endpoint) {
            try {
                const response = await fetch(endpoint, {
                    headers: {
                        'X-Telegram-Init-Data': webapp.initData
                    }
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP error! Status: ${response.status}, Message: ${errorText}`);
                }
                
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }
        
        // Function to format dates
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('ru-RU', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit'
            });
        }
        
        // Function to format numbers
        function formatNumber(num) {
            return num.toLocaleString('ru-RU', {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            });
        }
        
        // Load dashboard statistics
        async function loadStats() {
            statsLoader.classList.remove('hidden');
            statsError.classList.add('hidden');
            statsContent.classList.add('hidden');
            
            try {
                const data = await fetchWithAuth(`${API_BASE_URL}/panel-data`);
                
                // Populate statistics
                document.getElementById('countUsers').textContent = data.count_users;
                document.getElementById('totalBalance').textContent = formatNumber(data.total_users_balance);
                document.getElementById('countAllGifts').textContent = data.count_all_gifts;
                document.getElementById('countActiveGifts').textContent = data.count_active_gifts;
                document.getElementById('countCompletedGifts').textContent = data.count_completed_gifts;
                document.getElementById('tradingVolume').textContent = formatNumber(data.trading_volume);
                document.getElementById('nestGifterBalance').textContent = formatNumber(data.nest_gifter_balance);
                
                statsContent.classList.remove('hidden');
            } catch (error) {
                statsError.textContent = `Ошибка загрузки статистики: ${error.message}`;
                statsError.classList.remove('hidden');
            } finally {
                statsLoader.classList.add('hidden');
            }
        }
        
        // Load users list
        async function loadUsers(page = 1) {
            usersLoader.classList.remove('hidden');
            usersError.classList.add('hidden');
            usersContent.classList.add('hidden');
            
            try {
                const offset = (page - 1) * ITEMS_PER_PAGE;
                const data = await fetchWithAuth(`${API_BASE_URL}/users?limit=${ITEMS_PER_PAGE}&offset=${offset}`);
                
                // Update total count
                document.getElementById('totalUsers').textContent = `Всего: ${data.total_count}`;
                
                // Clear table body
                const tableBody = document.getElementById('usersTableBody');
                tableBody.innerHTML = '';
                
                // Populate table
                data.users.forEach(user => {
                    const row = document.createElement('tr');
                    row.className = 'hover:bg-gray-50 dark:hover:bg-gray-700';
                    
                    const usernameDisplay = user.username ? `@${user.username}` : (user.first_name || '—');
                    const statusBadge = user.is_banned 
                        ? `<span class="inline-block px-2 py-1 text-xs font-medium text-white bg-red-600 rounded">Забанен</span>` 
                        : `<span class="inline-block px-2 py-1 text-xs font-medium text-white bg-green-600 rounded">Активен</span>`;
                    
                    row.innerHTML = `
                        <td class="py-3 px-3">${user.id}</td>
                        <td class="py-3 px-3">${usernameDisplay}</td>
                        <td class="py-3 px-3">${formatNumber(user.balance)}</td>
                        <td class="py-3 px-3">${user.referrals_count}</td>
                        <td class="py-3 px-3">${formatDate(user.created_at)}</td>
                        <td class="py-3 px-3">${statusBadge}</td>
                    `;
                    
                    tableBody.appendChild(row);
                });
                
                // Update pagination
                updatePagination(data.total_count, page);
                
                usersContent.classList.remove('hidden');
            } catch (error) {
                usersError.textContent = `Ошибка загрузки пользователей: ${error.message}`;
                usersError.classList.remove('hidden');
            } finally {
                usersLoader.classList.add('hidden');
            }
        }
        
        // Update pagination controls
        function updatePagination(totalCount, currentPage) {
            const totalPages = Math.ceil(totalCount / ITEMS_PER_PAGE);
            const pagination = document.getElementById('usersPagination');
            pagination.innerHTML = '';
            
            // Previous button
            const prevLi = document.createElement('li');
            prevLi.innerHTML = `
                <a href="#" data-page="${currentPage - 1}" 
                   class="${currentPage === 1 ? 'pointer-events-none opacity-50' : ''} 
                          flex items-center justify-center h-8 leading-tight px-3 
                          border border-gray-300 dark:border-gray-600 
                          ${currentPage === 1 ? 'bg-gray-100 dark:bg-gray-700' : 'bg-white dark:bg-gray-800'} 
                          text-gray-500 dark:text-gray-400 rounded-l-lg">
                    Назад
                </a>
            `;
            pagination.appendChild(prevLi);
            
            // Page numbers
            let startPage = Math.max(1, currentPage - 2);
            let endPage = Math.min(totalPages, startPage + 4);
            
            if (endPage - startPage < 4 && startPage > 1) {
                startPage = Math.max(1, endPage - 4);
            }
            
            for (let i = startPage; i <= endPage; i++) {
                const pageLi = document.createElement('li');
                pageLi.innerHTML = `
                    <a href="#" data-page="${i}" 
                       class="flex items-center justify-center h-8 leading-tight px-3 
                              border border-gray-300 dark:border-gray-600
                              ${i === currentPage 
                                ? 'bg-tgbutton text-white' 
                                : 'bg-white dark:bg-gray-800 text-gray-500 dark:text-gray-400'}">
                        ${i}
                    </a>
                `;
                pagination.appendChild(pageLi);
            }
            
            // Next button
            const nextLi = document.createElement('li');
            nextLi.innerHTML = `
                <a href="#" data-page="${currentPage + 1}" 
                   class="${currentPage === totalPages ? 'pointer-events-none opacity-50' : ''} 
                          flex items-center justify-center h-8 leading-tight px-3 
                          border border-gray-300 dark:border-gray-600 
                          ${currentPage === totalPages ? 'bg-gray-100 dark:bg-gray-700' : 'bg-white dark:bg-gray-800'} 
                          text-gray-500 dark:text-gray-400 rounded-r-lg">
                    Далее
                </a>
            `;
            pagination.appendChild(nextLi);
            
            // Add click event listeners to pagination
            const pageLinks = pagination.querySelectorAll('a');
            pageLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    if (!link.classList.contains('pointer-events-none')) {
                        const newPage = parseInt(link.getAttribute('data-page'));
                        currentUsersPage = newPage;
                        loadUsers(newPage);
                    }
                });
            });
        }
        
        // Tab change event listeners
        dashboardTab.addEventListener('click', () => {
            // Update UI
            dashboardTab.classList.add('active-tab', 'text-tgbutton', 'dark:text-tgbuttontext', 'border-t-2', 'border-tgbutton');
            dashboardTab.classList.remove('text-gray-500', 'dark:text-gray-400');
            usersTab.classList.remove('active-tab', 'text-tgbutton', 'dark:text-tgbuttontext', 'border-t-2', 'border-tgbutton');
            usersTab.classList.add('text-gray-500', 'dark:text-gray-400');
            
            // Show/hide content
            dashboardPane.classList.remove('hidden');
            usersPane.classList.add('hidden');
            
            // Load data
            loadStats();
        });
        
        usersTab.addEventListener('click', () => {
            // Update UI
            usersTab.classList.add('active-tab', 'text-tgbutton', 'dark:text-tgbuttontext', 'border-t-2', 'border-tgbutton');
            usersTab.classList.remove('text-gray-500', 'dark:text-gray-400');
            dashboardTab.classList.remove('active-tab', 'text-tgbutton', 'dark:text-tgbuttontext', 'border-t-2', 'border-tgbutton');
            dashboardTab.classList.add('text-gray-500', 'dark:text-gray-400');
            
            // Show/hide content
            dashboardPane.classList.add('hidden');
            usersPane.classList.remove('hidden');
            
            // Load data
            loadUsers(currentUsersPage);
        });
        
        // Initial load
        document.addEventListener('DOMContentLoaded', () => {
            // Load initial tab data
            loadStats();
        });
    </script>
</body>
</html>
